name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder (dist)
        run: |
          mkdir -p dist
          cp index.html styles.css fonts.css sw.js \
             prayer-data.js utils.js data.js ui.js table.js \
             karah.js timeline.js clock.js pwa.js app.js dist/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons (optional, needs icon.png in repo root)
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mawaqit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
